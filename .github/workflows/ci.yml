name: MATLAB CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          # Supported release (see README). Note: the input is `release`, not `version`.
          release: R2024a
          cache: true

      - name: Run tests
        uses: matlab-actions/run-tests@v3
        with:
          source-folder: src
          select-by-folder: tests
          test-results-junit: results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: results/
